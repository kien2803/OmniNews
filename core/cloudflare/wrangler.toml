name = "omninews"
main = "src/index.ts"
compatibility_date = "2026-10-19"
workers_dev = true

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
# Serve literal .html paths (Google site-verification file) instead of
# clean-URL redirecting them to the extensionless path.
html_handling = "none"
# API + OAuth paths must reach the Worker even for browser navigations —
# without this, the assets layer's SPA fallback answers /api/auth/facebook/start
# with index.html (Accept: text/html) and the OAuth redirect never happens.
run_worker_first = ["/api/*", "/auth/*", "/health"]

# ── D1 (SQLite) ─────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "omninews-db"
database_id = "1a1a3c27-f11b-422f-a4a1-a40074a80a9a"
migrations_dir = "migrations"

# ── R2 (optional object storage — articles store image URLs, no binary) ──────────────────────────────────
# [[r2_buckets]]                    # TODO: uncomment after enabling R2 in dashboard
# binding = "STORAGE"
# bucket_name = "omninews-media"

# ── Queue: publish jobs (with dead-letter) ──────────────────────────
[[queues.producers]]
binding = "PUBLISH_QUEUE"
queue = "omninews-publish"

[[queues.consumers]]
queue = "omninews-publish"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 5
dead_letter_queue = "omninews-publish-dlq"

[[queues.consumers]]
queue = "omninews-publish-dlq"
max_batch_size = 10
max_retries = 0

# ── Cron: claim due posts → enqueue (replaces 30s poll loop; CF min 60s) ──
[triggers]
crons = ["*/1 * * * *"]

# ── Secrets (set via `wrangler secret put`) ─────────────────────────
# TOKEN_ENCRYPTION_KEY, JWT_SECRET
# META_APP_ID, META_APP_SECRET
# THREADS_APP_ID, THREADS_APP_SECRET
# REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET
# X_CLIENT_ID, X_CLIENT_SECRET

[vars]
# Public origin for OAuth redirect_uri — must match platform consoles.
WEB_ORIGIN = "https://omninews.trunkynw2803.workers.dev"
META_REDIRECT_URI = "https://omninews.trunkynw2803.workers.dev/auth/meta/callback"
THREADS_REDIRECT_URI = "https://omninews.trunkynw2803.workers.dev/auth/threads/callback"
REDDIT_REDIRECT_URI = "https://omninews.trunkynw2803.workers.dev/auth/reddit/callback"
X_REDIRECT_URI = "https://omninews.trunkynw2803.workers.dev/auth/x/callback"
# OAuth cookies are marked Secure whenever WEB_ORIGIN is https (cookieOpts
# derives it) — SECURE_COOKIES was dead config here and has been removed.
STORAGE_QUOTA_GB = "10"
# Dev toggle: publishers return fake external ids without calling platforms.
MOCK_PUBLISHERS = "false"
META_API_VERSION = "v24.0"
